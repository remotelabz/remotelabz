doctrine:
    orm:
        auto_generate_proxy_classes: false
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        result_cache_driver:
            type: pool
            pool: doctrine.result_cache_pool

framework:
    cache:
        pools:
            # Le cache de résultats DQL est stocké dans Redis (cf. cache.yaml) :
            # l'adaptateur par défaut de cache.app (filesystem) peut échouer en
            # accès concurrent ("rename(...): No such file or directory").
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
            # Le cache de requêtes DQL (objets Doctrine\ORM\Query\ParserResult)
            # utilisait cache.system, c.-à-d. PhpFilesAdapter sur
            # var/cache/prod/pools/system/..., également sujet aux erreurs de
            # rename() sous forte concurrence. On le bascule sur Redis.
            doctrine.system_cache_pool:
                adapter: cache.adapter.redis
