- hosts: all
  become: true
  become_method: sudo
  vars:
    worker_repo: "https://github.com/remotelabz/remotelabz-worker.git"
    worker_branch: "dev"
    worker_dir: "{{ ansible_facts.user_dir }}/remotelabz-worker"

  tasks:
    - name: Cloner le worker
      ansible.builtin.git:
        repo: "{{ worker_repo }}"
        dest: "{{ worker_dir }}"
        version: "{{ worker_branch }}"
        single_branch: true
        depth: 1

    - name: Lancer l'installation du worker (crée remotelabz-worker)
      ansible.builtin.shell: |
        {
          echo "{{ worker_topology }}"
          echo "{{ worker_adm_interface }}"
          echo "{{ worker_data_interface }}"
          echo "{{ worker_ip }}"
          echo "{{ worker_internet_interface }}"
          echo "{{ worker_front_ip }}"
          echo "{{ worker_data_network }}"
          echo "{{ worker_data_ip }}"
          echo "{{ worker_data_gateway }}"
          echo "{{ worker_vpn_local }}"
          echo "{{ worker_ssh_password }}"
          echo "{{ worker_front_password }}"
          echo "{{ worker_wss }}"
          echo "{{ worker_contact_mail }}"
          echo "n"
          echo ""
        } | sudo bash ./bin/install.sh 2>&1 | tee /tmp/worker_install.log
      args:
        chdir: "{{ worker_dir }}"

    - name: Créer .ssh directory pour remotelabz-worker
      ansible.builtin.file:
        path: /home/remotelabz-worker/.ssh
        state: directory
        owner: remotelabz-worker
        group: remotelabz-worker
        mode: "0700"

    - name: Installer clé SSH dans authorized_keys pour remotelabz-worker
      ansible.builtin.lineinfile:
        path: /home/remotelabz-worker/.ssh/authorized_keys
        line: "{{ lookup('file', '/home/remotelabz/.ssh/myremotelabzfront.pub') | trim }}"
        create: true
        owner: remotelabz-worker
        group: remotelabz-worker
        mode: "0600"
