name: Symfony

on:
  push:
    branches: [ "webinstaller" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Retirer Firefox et snapd des mises à jour
      run: |
        sudo apt-mark hold firefox snapd
        sudo apt-get purge -y firefox || true

    - name: Add PHP repository
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common ca-certificates gnupg
        sudo add-apt-repository -y ppa:ondrej/php
        sudo apt-get update

    - name: Prepare MySQL (root sans mot de passe)
      run: |
        sudo systemctl start mysql
        for i in $(seq 1 30); do
          sudo mysqladmin ping --silent && break
          sleep 1
        done
        # Sur le runner, root a le mot de passe "root" ; on tente aussi le socket
        sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY ''; FLUSH PRIVILEGES;" \
          || mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY ''; FLUSH PRIVILEGES;"
        mysql -uroot -e "SELECT 1"

    - name: Install remotelabz (script)
      shell: bash
      env:
        TERM: xterm
        DEBIAN_FRONTEND: noninteractive
      run: |
        ln -sfn "$GITHUB_WORKSPACE" /home/runner/remotelabz
        sudo mkdir -p /opt/remotelabz /home/root
        sudo cp .env /opt/remotelabz/.env.local
        sudo apt-get install -y expect
        cd bin
        sudo --preserve-env=TERM,DEBIAN_FRONTEND expect -c '
          set timeout 900
          set menu 0
          log_file -a /tmp/install.log
          spawn bash ./install.sh
          expect {
            -re {Enter your choice \[1-7\]: } {
              if {$menu == 0} { send "1\r"; set menu 1 } else { send "7\r" }
              exp_continue
            }
            -re {review/edit the existing configuration} { send "n\r"; exp_continue }
            -re {review/edit the configuration now}      { send "n\r"; exp_continue }
            -re {public IP or FQDN: }                    { send "127.0.0.1\r"; exp_continue }
            -re {(Enter|Re-Enter) New CA passphrase}     { send "\r"; exp_continue }
            -re {PEM passphrase: }                       { send "pempass1234\r"; exp_continue }
            -re {Press Enter to continue}                { send "\r"; exp_continue }
            -re {\(Y/n\): }                              { send "y\r"; exp_continue }
            eof
          }
          catch wait result
          exit [lindex $result 3]
        '

    - name: Show install log
      if: failure()
      run: tail -150 /tmp/install.log

    - name: Run tests
      run: |
        cd /opt/remotelabz
        php bin/console cache:clear --env=test
        php bin/phpunit --log-junit var/log/res.xml
        
      
      continue-on-error: true

    - name: Convert report to html
      run: |
        cd /opt/remotelabz
        python3 bin/xml2htmlReport.py var/log/res.xml var/log/res.html
      if: always()

    - name: Upload test result
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: /opt/remotelabz/var/log/res.html
        retention-days: 14