name: Symfony

on:
  push:
    branches: [ "webinstaller" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4


    - name: Install remotelabz (script)
      run: |
        mkdir /opt/remotelabz
        cp ../.env /opt/remotelabz/.env.local
        
        echo "1
        n
        y" | sudo ./install.sh
