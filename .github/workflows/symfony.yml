name: Symfony

on:
  push:
    branches: [ "webinstaller" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4


    - name: Install remotelabz (script)

      env:
        TERM: xterm

      run: |
        cd bin

        mkdir /opt/remotelabz
        cp ../.env /opt/remotelabz/.env.local

        sudo mkdir -p /home/root
        
        echo "1
        n
        y" | sudo bash -x ./install.sh 2>&1 | tail -80
