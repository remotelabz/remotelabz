name: Symfony

on:
  push:
    branches: [ "webinstaller" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  symfony-tests:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Retirer Firefox et snapd des mises à jour
      run: |
        sudo apt-mark hold firefox snapd
        sudo apt-get purge -y firefox || true

    - name: Add PHP repository
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common ca-certificates gnupg
        sudo add-apt-repository -y ppa:ondrej/php
        sudo apt-get update

    - name: Prepare MySQL (root sans mot de passe)
      run: |
        sudo systemctl start mysql
        for i in $(seq 1 30); do
          sudo mysqladmin ping --silent && break
          sleep 1
        done
        # Sur le runner, root a le mot de passe "root" ; on tente aussi le socket
        sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY ''; FLUSH PRIVILEGES;" \
          || mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY ''; FLUSH PRIVILEGES;"
        mysql -uroot -e "SELECT 1"

    - name: Install remotelabz (script)
      shell: bash
      env:
        TERM: xterm
        DEBIAN_FRONTEND: noninteractive
      run: |
        pwd
        ln -sfn "$GITHUB_WORKSPACE" /home/runner/remotelabz
        sudo mkdir -p /opt/remotelabz /home/root
        sudo cp .env /opt/remotelabz/.env.local
        cd bin
        printf '1\nn\ny\n' | sudo --preserve-env=TERM,DEBIAN_FRONTEND bash -x ./install.sh 2>&1 | tail -80